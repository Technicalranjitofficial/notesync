<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="8" fill="#0c0c0e"/>
  <!-- Amber accent top-right dot -->
  <circle cx="26" cy="6" r="2.5" fill="#f59e0b"/>
  <!-- Document / note shape -->
  <rect x="6" y="7" width="14" height="18" rx="2" fill="#1c1c22" stroke="#f59e0b" stroke-width="1.2"/>
  <!-- Lines inside note (representing text/notes) -->
  <line x1="9" y1="12" x2="17" y2="12" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="9" y1="15.5" x2="17" y2="15.5" stroke="#9a9488" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="9" y1="19" x2="14" y2="19" stroke="#9a9488" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- Sync arrow (right side, overlapping document) -->
  <path d="M19 14 C23 14 25 17 25 19 C25 21 23 23 19 23" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <polyline points="17,21 19,23 17,25" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>